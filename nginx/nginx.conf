# =============================================================================
# Nginx Reverse Proxy - UAM StreamApps
# Un puerto por contenedor Kasm — inyecta BasicAuth automáticamente
# No requiere rewrite de rutas (KasmVNC funciona en raíz /)
# =============================================================================

events {
    worker_connections 1024;
}

http {
    # Timeouts para websocket de KasmVNC (sesiones largas)
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_connect_timeout 7s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --- Contenedor Kasm 01 (puerto 8901) ---
    server {
        listen 8901 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        proxy_buffering off;

        location / {
            proxy_pass https://kasm_01:6901;
            proxy_set_header Authorization "Basic a2FzbV91c2VyOk1heWFiMjAyNg==";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # No verificar cert auto-firmado de Kasm
            proxy_ssl_verify off;
        }
    }

    # --- Contenedor Kasm 02 (puerto 8902) ---
    server {
        listen 8902 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        proxy_buffering off;

        location / {
            proxy_pass https://kasm_02:6901;
            proxy_set_header Authorization "Basic a2FzbV91c2VyOk1heWFiMjAyNg==";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # No verificar cert auto-firmado de Kasm
            proxy_ssl_verify off;
        }
    }

    # --- Contenedor Kasm 03 (puerto 8903) ---
    server {
        listen 8903 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        proxy_buffering off;

        location / {
            proxy_pass https://kasm_03:6901;
            proxy_set_header Authorization "Basic a2FzbV91c2VyOk1heWFiMjAyNg==";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Websocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # No verificar cert auto-firmado de Kasm
            proxy_ssl_verify off;
        }
    }

    # --- Portal Web (HTTPS en puerto 443) ---
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        location / {
            proxy_pass http://portal:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Websocket support (por si el portal lo necesita a futuro)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

}
