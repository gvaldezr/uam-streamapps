<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refinitiv Workspace — Contenedor #{{ container_id }}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }
        #kasm-frame {
            position: fixed;
            inset: 0;               /* top:0 right:0 bottom:0 left:0 */
            border: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
        }
        /*
         * Aviso del certificado: se coloca ABAJO A LA DERECHA para no cubrir el
         * borde superior/izquierdo, que es donde KasmVNC muestra su control
         * (handle) para desplegar la barra lateral de opciones. Es descartable
         * y se oculta solo tras unos segundos, de modo que nunca intercepta el
         * hover sobre los bordes del iframe.
         */
        #aviso-cert {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            max-width: 360px;
            background: #2D2D2D;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.82rem;
            line-height: 1.35;
            padding: 0.7rem 0.9rem;
            border-radius: 8px;
            z-index: 15;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            transition: opacity 0.4s ease;
        }
        #aviso-cert.oculto {
            opacity: 0;
            pointer-events: none;
        }
        #aviso-cert a {
            color: #7CB9E8;
        }
        #aviso-cert button {
            background: transparent;
            border: 1px solid #666;
            color: #ccc;
            padding: 0.2rem 0.55rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.75rem;
            flex-shrink: 0;
        }
        #cerrando {
            position: fixed;
            inset: 0;
            background: rgba(26,26,26,0.95);
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 20;
        }
    </style>
</head>
<body>
    <!-- Aviso inicial (abajo-derecha, descartable, no cubre los bordes del iframe) -->
    <div id="aviso-cert">
        <span>
            ¿Pantalla en blanco? Abra
            <a href="{{ kasm_url }}" target="_blank" rel="noopener">la sesión directa</a>,
            acepte el certificado ("Avanzado" → "Continuar") y recargue aquí.<br>
            <small style="color:#9a9a9a;">La barra de opciones de Kasm aparece al acercar el mouse al borde izquierdo.</small>
        </span>
        <button type="button" onclick="ocultarAviso()">Cerrar</button>
    </div>

    <iframe id="kasm-frame"
            src="{{ kasm_url }}"
            allow="clipboard-read *; clipboard-write *; fullscreen *"
            allowfullscreen></iframe>

    <div id="cerrando">
        <p>Sesión cerrada. Cerrando esta pestaña…</p>
    </div>

    <script>
        (function () {
            var CONTAINER_ID = "{{ container_id }}";
            var CHANNEL_NAME = "uam-kasm-session";

            // --- Aviso descartable -------------------------------------------
            var aviso = document.getElementById("aviso-cert");
            window.ocultarAviso = function () {
                if (aviso) aviso.classList.add("oculto");
            };
            // Se auto-oculta a los 12 s para liberar por completo el viewport.
            setTimeout(window.ocultarAviso, 12000);

            function cerrarEstaVentana() {
                // Esta ventana fue abierta por window.open() desde session.html
                // (mismo origen), por lo que window.close() está permitido.
                document.getElementById("cerrando").style.display = "flex";
                // Pequeño delay para que el usuario vea el mensaje.
                setTimeout(function () {
                    window.close();
                    // Si el navegador rehúsa cerrar (p. ej. la pestaña fue abierta
                    // manualmente y no por script), al menos dejamos claro el estado.
                    setTimeout(function () {
                        document.querySelector("#cerrando p").textContent =
                            "Sesión cerrada. Puede cerrar esta pestaña manualmente.";
                    }, 800);
                }, 300);
            }

            // Canal principal: BroadcastChannel entre pestañas del mismo origen.
            var bc = null;
            if ("BroadcastChannel" in window) {
                bc = new BroadcastChannel(CHANNEL_NAME);
                bc.onmessage = function (ev) {
                    var data = ev.data || {};
                    if (data.type === "logout" &&
                        (data.containerId == null || String(data.containerId) === CONTAINER_ID)) {
                        cerrarEstaVentana();
                    }
                };
            }

            // Respaldo: localStorage 'storage' event, también same-origin y
            // disponible en navegadores sin BroadcastChannel.
            window.addEventListener("storage", function (ev) {
                if (ev.key === "uam-kasm-logout" && ev.newValue) {
                    try {
                        var payload = JSON.parse(ev.newValue);
                        if (payload.containerId == null ||
                            String(payload.containerId) === CONTAINER_ID) {
                            cerrarEstaVentana();
                        }
                    } catch (e) {
                        cerrarEstaVentana();
                    }
                }
            });

            // Respaldo adicional: recibir postMessage directo desde el opener.
            window.addEventListener("message", function (ev) {
                // Solo aceptar mensajes del mismo origen (el portal).
                if (ev.origin !== window.location.origin) return;
                var data = ev.data || {};
                if (data && data.type === "uam-logout") {
                    cerrarEstaVentana();
                }
            });
        })();
    </script>
</body>
</html>
