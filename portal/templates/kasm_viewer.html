<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refinitiv Workspace — Contenedor #{{ container_id }}</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }
        #kasm-frame {
            border: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #aviso-cert {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: #2D2D2D;
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 0.85rem;
            padding: 0.6rem 1rem;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        #aviso-cert a {
            color: #7CB9E8;
        }
        #aviso-cert button {
            background: transparent;
            border: 1px solid #666;
            color: #ccc;
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        #cerrando {
            position: fixed;
            inset: 0;
            background: rgba(26,26,26,0.95);
            color: #eee;
            font-family: system-ui, -apple-system, sans-serif;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 1rem;
            z-index: 20;
        }
    </style>
</head>
<body>
    <!-- Aviso inicial: aceptar certificado auto-firmado de Kasm -->
    <div id="aviso-cert">
        <span>
            Si ve una pantalla en blanco, abra
            <a href="{{ kasm_url }}" target="_blank" rel="noopener">{{ kasm_url }}</a>
            en una pestaña, acepte el certificado ("Avanzado" → "Continuar") y recargue aquí.
        </span>
        <button type="button" onclick="document.getElementById('aviso-cert').style.display='none'">Ocultar</button>
    </div>

    <iframe id="kasm-frame"
            src="{{ kasm_url }}"
            allow="clipboard-read *; clipboard-write *; fullscreen *"
            allowfullscreen></iframe>

    <div id="cerrando">
        <p>Sesión cerrada. Cerrando esta pestaña…</p>
    </div>

    <script>
        (function () {
            var CONTAINER_ID = "{{ container_id }}";
            var CHANNEL_NAME = "uam-kasm-session";

            function cerrarEstaVentana() {
                // Esta ventana fue abierta por window.open() desde session.html
                // (mismo origen), por lo que window.close() está permitido.
                document.getElementById("cerrando").style.display = "flex";
                // Pequeño delay para que el usuario vea el mensaje.
                setTimeout(function () {
                    window.close();
                    // Si el navegador rehúsa cerrar (p. ej. la pestaña fue abierta
                    // manualmente y no por script), al menos dejamos claro el estado.
                    setTimeout(function () {
                        document.querySelector("#cerrando p").textContent =
                            "Sesión cerrada. Puede cerrar esta pestaña manualmente.";
                    }, 800);
                }, 300);
            }

            // Canal principal: BroadcastChannel entre pestañas del mismo origen.
            var bc = null;
            if ("BroadcastChannel" in window) {
                bc = new BroadcastChannel(CHANNEL_NAME);
                bc.onmessage = function (ev) {
                    var data = ev.data || {};
                    if (data.type === "logout" &&
                        (data.containerId == null || String(data.containerId) === CONTAINER_ID)) {
                        cerrarEstaVentana();
                    }
                };
            }

            // Respaldo: localStorage 'storage' event, también same-origin y
            // disponible en navegadores sin BroadcastChannel.
            window.addEventListener("storage", function (ev) {
                if (ev.key === "uam-kasm-logout" && ev.newValue) {
                    try {
                        var payload = JSON.parse(ev.newValue);
                        if (payload.containerId == null ||
                            String(payload.containerId) === CONTAINER_ID) {
                            cerrarEstaVentana();
                        }
                    } catch (e) {
                        cerrarEstaVentana();
                    }
                }
            });

            // Respaldo adicional: recibir postMessage directo desde el opener.
            window.addEventListener("message", function (ev) {
                // Solo aceptar mensajes del mismo origen (el portal).
                if (ev.origin !== window.location.origin) return;
                var data = ev.data || {};
                if (data && data.type === "uam-logout") {
                    cerrarEstaVentana();
                }
            });
        })();
    </script>
</body>
</html>
