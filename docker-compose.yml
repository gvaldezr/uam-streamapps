# =============================================================================
# UAM StreamApps - Docker Compose Maestro
# Orquesta el portal web y 25 contenedores Kasm (terminales de streaming)
# Generado automáticamente - 25 instancias con anclas YAML para evitar
# repetición de configuración común.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Portal Web - Interfaz de administración y monitoreo
  # ---------------------------------------------------------------------------
  portal:
    build: ./portal
    container_name: uam_portal
    ports:
      - "8080:8080"
    volumes:
      - ./config.json:/app/config.json:ro
    env_file: .env
    restart: unless-stopped
    depends_on:
      - kasm_01
      - kasm_02
      - kasm_03
      - kasm_04
      - kasm_05
      - kasm_06
      - kasm_07
      - kasm_08
      - kasm_09
      - kasm_10
      - kasm_11
      - kasm_12
      - kasm_13
      - kasm_14
      - kasm_15
      - kasm_16
      - kasm_17
      - kasm_18
      - kasm_19
      - kasm_20
      - kasm_21
      - kasm_22
      - kasm_23
      - kasm_24
      - kasm_25

  # ---------------------------------------------------------------------------
  # Contenedores Kasm (01-25) - Terminales de streaming con Chrome
  # Cada uno expone VNC en un puerto único (6901-6925) y monta un volumen
  # persistente para datos de sesión de Chrome.
  #
  # Se usa un ancla YAML (&kasm_defaults) para definir la configuración común
  # una sola vez. Cada contenedor solo especifica lo que cambia:
  #   - container_name
  #   - puerto del host
  #   - volumen de datos de Chrome
  # ---------------------------------------------------------------------------

  # --- Contenedor 01 (define el ancla con la configuración base) ---
  kasm_01:
    &kasm_defaults
    build:
      context: .
      dockerfile: Dockerfile.kasm
    platform: linux/amd64
    container_name: kasm_01
    restart: unless-stopped
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    environment:
      VNC_PW: "Mayab2026"
      LAUNCH_URL: "https://amers1.identity.ciam.refinitiv.net/auth/UI/Login?epaid=3463a59213444428bee5ead88ff1d9004441b654&goto=https%3A%2F%2Fsts.identity.ciam.refinitiv.net%2Foauth2%2Fv1%2Fauthorize%3Fclient_id%3D3463a59213444428bee5ead88ff1d9004441b654%26redirect_uri%3Dhttps%253A%252F%252Fworkspace.refinitiv.com%252Fauth%252Fcallback%26response_type%3Dcode%26state%3D01f7013be25f41ec8e4bfe5ac407614d%26scope%3Dtrapi.eikon.sessioninfo%2520trapi%2520trading%2520finmechanics%2520rdpapi%2520app"
      KASM_SVC_AUDIO: "0"
      KASM_SVC_AUDIO_INPUT: "0"
    ports:
      - "6901:6901"
    volumes:
      - kasm_chrome_01:/opt/chrome-data

  # --- Contenedor 02 ---
  kasm_02:
    <<: *kasm_defaults
    container_name: kasm_02
    ports:
      - "6902:6901"
    volumes:
      - kasm_chrome_02:/opt/chrome-data

  # --- Contenedor 03 ---
  kasm_03:
    <<: *kasm_defaults
    container_name: kasm_03
    ports:
